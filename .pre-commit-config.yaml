# Commit hooks, run by pre-commit (https://pre-commit.com) on the files a commit adds or
# changes. Turn them on once per clone: pre-commit install
# Run them on every file: pre-commit run --all-files
repos:
  # Secrets in the staged changes.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # terraform fmt on changed .tf files (uses the terraform on your PATH).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt

  # Leftover merge-conflict markers, files over 500 KB (e.g. state or plan files), invalid JSON.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge] # check every commit, not only during a merge
      - id: check-added-large-files
        args: [--enforce-all] # also files a commit grows, not only new ones
      - id: check-json

  - repo: local
    hooks:
      # The skill reference is generated from columns.json: regenerate it on every commit (about
      # 0.05 s) and fail if the staged copy differs, so a schema change can't be committed without
      # its reference.
      - id: skill-reference
        name: skill reference matches columns.json
        language: system
        entry: >-
          sh -c 'python3 tools/gen_skill_reference.py >/dev/null || exit 1;
          r=skills/traceforce-lakehouse/reference;
          if ! git diff --quiet -- "$r" || [ -n "$(git ls-files --others --exclude-standard -- "$r")" ]; then
          echo "Regenerated $r: stage it and commit again."; exit 1; fi'
        always_run: true # also catches a commit that only deletes a reference file
        pass_filenames: false

      # The Databricks SQL must not depend on the session time zone. A script can't set it, so
      # the golden run (in a UTC session) can't catch a dependency: fail on convert_timezone(),
      # which round-trips through session-local time. Text after -- is ignored.
      - id: databricks-sql-no-session-time-zone
        name: Databricks SQL doesn't use convert_timezone()
        language: pygrep
        entry: '(?i)^(?:(?!--).)*convert_timezone\s*\('
        files: ^terraform/azure/databricks/sql/

      # run_trino.py imitates Athena's partition projection with copies of the AWS module's
      # settings (no Trino needed for this check): fail if they no longer match.
      - id: golden-trino-projection
        name: golden Trino runner matches the AWS projection settings
        language: system
        entry: python3 tests/golden/run_trino.py --check-projection
        files: ^(terraform/aws/(raw|locals|exports)\.tf|tests/golden/run_trino\.py)$
        pass_filenames: false

      # tests/golden/fixture/ is generated by make_fixture.py: fail if they differ (a file edited
      # by hand, or make_fixture.py changed without regenerating).
      - id: golden-fixture
        name: golden fixture matches make_fixture.py
        language: system
        entry: >-
          sh -c 't=$(mktemp -d) && python3 tests/golden/make_fixture.py "$t" >/dev/null &&
          diff -r "$t" tests/golden/fixture; r=$?; rm -rf "$t"; exit $r'
        files: ^tests/golden/(make_fixture\.py|fixture/)
        pass_filenames: false
